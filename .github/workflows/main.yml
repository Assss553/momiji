name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android tools
        run: |
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | sudo env "JAVA_HOME=$JAVA_HOME" "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          sudo env "JAVA_HOME=$JAVA_HOME" "$SDKM" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          sudo chmod -R a+rwX "$ANDROID_HOME"
      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleFdroidDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ROX-Phone-APK
          path: android/app/build/outputs/apk/fdroid/debug/*.apk
